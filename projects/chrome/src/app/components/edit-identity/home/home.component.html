@if (identity?.site) {
  <div class="site-identity">
    <p>
      Site-only identity for <strong>{{ identity?.site }}</strong>. Delete it when
      you are done, or keep it.
    </p>
    <button type="button" class="action quiet" (click)="onClickKeep()">
      Keep as a regular identity
    </button>
  </div>
}

<lib-nav-item text="Keys" (click)="onClickNavigateTo('keys')"></lib-nav-item>

<lib-nav-item
  text="Permissions"
  (click)="onClickNavigateTo('permissions')"
></lib-nav-item>

<div class="sam-flex-grow"></div>

<button
  type="button"
  class="action danger"
  (click)="
    confirm.show(
      'Delete this identity?',
      onConfirmDeletion.bind(this)
    )
  "
>
  Delete identity
</button>

<lib-confirm #confirm> </lib-confirm>
