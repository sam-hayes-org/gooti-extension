<div class="sam-text-header">
  <span>Settings</span>
</div>

<section class="group">
  <p class="kicker">Vault</p>
  <div class="pair">
    <button
      type="button"
      class="quiet"
      (click)="
        confirm.inform(
          'Your exported vault snapshot is secured with your vault password. When you import the vault snapshot later, you still need the vault password to access your vault.',
          onClickExportVault.bind(this),
          'Export'
        )
      "
    >
      Export
    </button>
    <button type="button" class="quiet" (click)="navigate('/vault-import')">
      Import
    </button>
  </div>
  @if (
    syncPanel()?.phase === 'offer' ||
    syncPanel()?.phase === 'restore' ||
    syncPanel()?.phase === 'phrase'
  ) {
    <button
      type="button"
      class="quiet"
      [disabled]="syncPanel()?.busy"
      (click)="syncPanel()?.onShowRestore()"
    >
      Restore with passphrase
    </button>
  }
  <button
    type="button"
    class="quiet"
    (click)="
      confirm.show('Do you really want to sign out?', onSignOut.bind(this))
    "
  >
    Sign out
  </button>
</section>

<lib-nostr-sync></lib-nostr-sync>

<section class="group">
  <p class="kicker danger">Danger zone</p>
  <button
    type="button"
    class="reset"
    (click)="
      confirm.show(
        'Do you really want to reset your extension? All data will be lost.',
        onResetExtension.bind(this)
      )
    "
  >
    Reset extension
  </button>
</section>

<lib-confirm #confirm></lib-confirm>
