<div class="decision">
  <div class="brand">
    <div class="logo">
      <img src="gooti.svg" width="76" height="76" alt="" />
    </div>
    <span>Gooti</span>
  </div>

  <div class="body">
    <h1>Your identities start here.</h1>
    <button type="button" class="choice" (click)="router.navigateByUrl('/vault-create/new')">
      <strong>Set up Gooti</strong>
      <span>and start fresh</span>
    </button>
    <button type="button" class="choice" (click)="router.navigateByUrl('/vault-import')">
      <strong>Import from a file</strong>
      <span>that you exported earlier</span>
    </button>
    <button type="button" class="choice" (click)="router.navigateByUrl('/vault-create/restore')">
      <strong>Restore from backup</strong>
      <span>on your relays, with your passphrase</span>
    </button>
  </div>
</div>
