<div class="stage">
  <div class="decision">
    <div class="brand">
      <img src="gooti.svg" width="18" height="18" alt="" />
      <span>Gooti</span>
    </div>

    <div class="body">
      @if (siteHost) {
        <p class="host">{{ siteHost }}</p>
      }
      <h1>Unlock Gooti</h1>

      <form (submit)="$event.preventDefault(); loginVault(passwordInputElement.value)">
        <div class="field">
          <input
            #passwordInputElement
            type="password"
            placeholder="Gooti password"
            aria-label="Gooti password"
            [(ngModel)]="loginPassword"
            name="password"
          />
          <button
            type="button"
            class="eye"
            [attr.aria-label]="
              passwordInputElement.type === 'password' ? 'Show password' : 'Hide password'
            "
            (click)="toggleType(passwordInputElement)"
          >
            <i
              class="bi"
              [class.bi-eye]="passwordInputElement.type === 'password'"
              [class.bi-eye-slash]="passwordInputElement.type === 'text'"
            ></i>
          </button>
        </div>

        @if (showInvalidPasswordAlert) {
          <p class="error">Invalid password</p>
        }

        <button class="submit" type="submit" [disabled]="!loginPassword">Unlock</button>
      </form>

      @if (fromBackground) {
        <p class="hint">Closing this window stops the site's request.</p>
      }

      <button
        type="button"
        class="reset"
        (click)="
          confirm.show(
            'Reset Gooti? All data in this browser will be deleted.',
            onClickResetExtension.bind(this)
          )
        "
      >
        Reset extension
      </button>
    </div>
  </div>
</div>

<lib-confirm #confirm></lib-confirm>
