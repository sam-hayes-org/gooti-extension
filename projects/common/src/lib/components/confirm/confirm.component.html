<!-- eslint-disable @angular-eslint/template/elements-content -->
<div [id]="idString" class="modal fade" data-bs-backdrop="static" tabindex="-1">
  <div
    class="modal-dialog modal-sm modal-dialog-centered modal-dialog-scrollable"
  >
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">{{ title }}</h5>
        <button
          type="button"
          class="btn-close"
          (click)="modal?.hide(); no.emit()"
        ></button>
      </div>
      <div class="modal-body">
        <span>{{ message }}</span>
      </div>
      <div class="modal-footer">
        @if (showNo) {
          <button type="button" class="action quiet" (click)="modal?.hide()">
            No
          </button>
        }
        @if (altLabel) {
          <button type="button" class="action quiet" (click)="onClickAlt()">
            {{ altLabel }}
          </button>
        }
        <button
          type="button"
          class="action"
          [class.primary]="!yesDanger"
          [class.danger]="yesDanger"
          (click)="onClickYes()"
        >
          {{ yesLabel }}
        </button>
      </div>
    </div>
  </div>
</div>
