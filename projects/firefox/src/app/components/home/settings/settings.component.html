<div class="sam-text-header">
  <span>Settings</span>
</div>

<section class="group">
  <p class="kicker">This browser</p>
  <div class="pair">
    <button
      type="button"
      class="quiet"
      (click)="
        confirm.inform(
          'Your export is protected by your Gooti password on this browser. You need that password to import it later.',
          onClickExportVault.bind(this),
          'Export'
        )
      "
    >
      Export
    </button>
    <button type="button" class="quiet" (click)="navigate('/vault-import')">
      Import
    </button>
  </div>
  @if (backupPanel()?.canRestore()) {
    <button
      type="button"
      class="quiet"
      [disabled]="backupPanel()?.busy"
      (click)="backupPanel()?.onShowRestore()"
    >
      Use an existing backup
    </button>
  }
  <button
    type="button"
    class="quiet"
    (click)="
      confirm.show('Lock Gooti?', onSignOut.bind(this))
    "
  >
    Lock
  </button>
</section>

<lib-backup-panel></lib-backup-panel>

<section class="group">
  <p class="kicker danger">Danger zone</p>
  <button
    type="button"
    class="reset"
    (click)="
      confirm.show(
        'Reset Gooti? All data in this browser will be deleted.',
        onResetExtension.bind(this)
      )
    "
  >
    Reset extension
  </button>
</section>

<lib-confirm #confirm></lib-confirm>
