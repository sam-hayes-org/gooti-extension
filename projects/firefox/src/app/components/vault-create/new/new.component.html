<div class="decision">
  <div class="brand">
    <img src="gooti.svg" width="18" height="18" alt="" />
    <span>Gooti</span>
  </div>

  <div class="body">
    <h1>Choose a password</h1>
    <p class="hint">Sensitive data is encrypted before it is stored.</p>

    <form (submit)="$event.preventDefault(); createVault(passwordInputElement.value)">
      <div class="field">
        <input
          #passwordInputElement
          type="password"
          placeholder="Vault password"
          aria-label="Vault password"
          [(ngModel)]="password"
          name="password"
        />
        <button
          type="button"
          class="eye"
          [attr.aria-label]="
            passwordInputElement.type === 'password' ? 'Show password' : 'Hide password'
          "
          (click)="toggleType(passwordInputElement)"
        >
          <i
            class="bi"
            [class.bi-eye]="passwordInputElement.type === 'password'"
            [class.bi-eye-slash]="passwordInputElement.type === 'text'"
          ></i>
        </button>
      </div>

      <button
        class="submit"
        type="submit"
        [disabled]="!password || password.length < minPasswordLength"
      >
        Create vault
      </button>
    </form>

    <button type="button" class="quiet" (click)="navigate('/vault-create/home')">Back</button>
  </div>
</div>
