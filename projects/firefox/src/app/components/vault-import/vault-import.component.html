<div class="decision">
  <div class="brand">
    <img src="gooti.svg" width="18" height="18" alt="" />
    <span>Gooti</span>
  </div>

  <div class="body">
    <h1>Import a vault</h1>
    <p class="hint">
      You can select any snapshot that you have previously uploaded on the
      <a href="options.html" target="_blank">options page</a>.
    </p>

    <select [(ngModel)]="selectedSnapshot" aria-label="Snapshot">
      @for (snapshot of snapshots; track snapshot) {
        <option [ngValue]="snapshot">{{ snapshot.fileName }}</option>
      }
    </select>

    <p class="hint note">Import replaces the vault stored in this browser.</p>

    <button
      type="button"
      class="submit"
      [disabled]="!selectedSnapshot"
      (click)="onClickImport()"
    >
      Import vault
    </button>
    <button type="button" class="quiet" (click)="navigate('/vault-create/home')">Back</button>
  </div>
</div>
